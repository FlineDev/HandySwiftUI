name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test-macos:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: swift build --build-system swiftbuild

      - name: Run tests
        if: hashFiles('Tests/**') != ''
        run: swift test --build-system swiftbuild
