name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-platforms:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, visionOS, watchOS]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Build for ${{ matrix.platform }}
        run: xcodebuild -scheme HandySwiftUI -destination 'generic/platform=${{ matrix.platform }}' CODE_SIGNING_ALLOWED=NO build

  test-macos:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Build package
        run: swift build --build-system swiftbuild

      - name: Run tests
        if: hashFiles('Tests/**') != ''
        run: swift test --build-system swiftbuild
